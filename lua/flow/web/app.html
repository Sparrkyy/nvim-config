<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flow — plan review</title>
<style>
:root {
  --bg: #fbfaf8; --panel: #ffffff; --ink: #1c1b19; --muted: #6b6862;
  --line: #e3e0da; --accent: #7c5cff; --accent-soft: #efeaff;
  --ok: #2f7d4f; --warn: #a8650c; --remove: #a43a46; --code-bg: #f3f1ec;
  --doc: 46rem; --gutter: 20rem;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16151a; --panel: #1d1c22; --ink: #e6e3dd; --muted: #97938c;
    --line: #302e38; --accent: #a892ff; --accent-soft: #2a2440;
    --ok: #6cc08a; --warn: #d9a441; --remove: #ef7a86; --code-bg: #24222b;
  }
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.7 ui-serif, Georgia, "Iowan Old Style", serif;
  -webkit-font-smoothing: antialiased;
}
header {
  position: sticky; top: 0; z-index: 20;
  display: flex; gap: .75rem; align-items: center; flex-wrap: wrap;
  padding: .7rem 1.5rem; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px); border-bottom: 1px solid var(--line);
  font-family: ui-sans-serif, system-ui, sans-serif;
}
header .title { font-weight: 600; font-size: .95rem; margin-right: auto;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40ch; }
header .status { font-size: .7rem; letter-spacing: .08em; text-transform: uppercase;
  color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: .1rem .55rem; }
header .status.ok { color: var(--ok); border-color: var(--ok); }
header .status.error { color: var(--warn); border-color: var(--warn); }
#narration { display: flex; gap: .4rem; align-items: center; flex-wrap: wrap; }
#progress { min-width: 3.5rem; color: var(--muted); font-size: .78rem; text-align: center; }
#voice-label, #speed-label { display: flex; gap: .35rem; align-items: center;
  color: var(--muted); font-size: .78rem; }
select, button {
  font: inherit; font-size: .82rem; font-family: ui-sans-serif, system-ui, sans-serif;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  border-radius: .45rem; padding: .35rem .7rem; cursor: pointer;
}
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .4; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.ghost { background: transparent; }

main { display: grid; grid-template-columns: 1fr var(--gutter); gap: 2rem;
  max-width: calc(var(--doc) + var(--gutter) + 6rem); margin: 0 auto; padding: 2.5rem 1.5rem 8rem; }
@media (max-width: 60rem) { main { grid-template-columns: 1fr; } aside { order: -1; } }

#doc { max-width: var(--doc); }
#doc > * { position: relative; scroll-margin-top: 5rem; }
#doc.guided > [data-chunk] { display: none; }
#doc.guided > [data-chunk].chunk-active { display: block; }
#doc.guided > h1.chunk-active,
#doc.guided > h2.chunk-active,
#doc.guided > h3.chunk-active { margin-top: 0; }
#doc h1 { font-size: 2rem; line-height: 1.25; margin: 0 0 1.5rem; letter-spacing: -.01em; }
#doc h2 { font-size: 1.25rem; margin: 2.75rem 0 .85rem; padding-bottom: .35rem;
  border-bottom: 1px solid var(--line); letter-spacing: -.005em; }
#doc h3 { font-size: 1rem; margin: 1.9rem 0 .6rem;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); }
#doc p, #doc li { font-size: 1.02rem; }
#doc ul, #doc ol { padding-left: 1.4rem; }
#doc li { margin: .3rem 0; }
#doc blockquote { margin: 1rem 0; padding: .1rem 1rem; border-left: 3px solid var(--accent);
  color: var(--muted); }
#doc code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .86em;
  background: var(--code-bg); padding: .1em .35em; border-radius: .25rem; }
#doc pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: .5rem;
  padding: .9rem 1rem; overflow-x: auto; }
#doc pre code { background: none; padding: 0; font-size: .82rem; line-height: 1.55; }
#doc pre code .code-line { display: block; min-height: 1.55em; margin: 0 -.45rem; padding: 0 .45rem; }
#doc pre code .code-add { color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); }
#doc pre code .code-remove { color: var(--remove); background: color-mix(in srgb, var(--remove) 12%, transparent); }
#doc pre code .code-hunk { color: var(--accent); }
#doc table { border-collapse: collapse; width: 100%; font-size: .92rem; display: block; overflow-x: auto; }
#doc th, #doc td { border: 1px solid var(--line); padding: .4rem .6rem; text-align: left; }
#doc th { background: var(--code-bg); font-weight: 600; }
#doc pre.mermaid { background: var(--panel); text-align: center; }
#doc pre.mermaid.error { text-align: left; border-color: var(--warn); color: var(--warn); }
#doc .plan-block-motion { animation: plan-block-in .38s cubic-bezier(.2,.8,.2,1) both; }
#doc pre.code-motion .code-line { animation: code-line-in .3s ease-out both;
  animation-delay: calc(var(--motion-index, 0) * 42ms); }
#doc pre.diagram-motion svg .node, #doc pre.diagram-motion svg .cluster,
#doc pre.diagram-motion svg .edgeLabel, #doc pre.diagram-motion svg .messageText,
#doc pre.diagram-motion svg .labelText {
  animation: diagram-node-in .42s cubic-bezier(.2,.8,.2,1) both;
  animation-delay: calc(var(--motion-index, 0) * 90ms); }
#doc pre.diagram-motion svg .edgePath path, #doc pre.diagram-motion svg .flowchart-link,
#doc pre.diagram-motion svg .messageLine0, #doc pre.diagram-motion svg .messageLine1,
#doc pre.diagram-motion svg .loopLine { stroke-dasharray: var(--path-length, 600);
  stroke-dashoffset: var(--path-length, 600); animation: diagram-path-in .75s ease-out forwards;
  animation-delay: calc(var(--motion-index, 0) * 90ms); }
#doc .commented { background: var(--accent-soft); border-radius: .3rem;
  box-shadow: -.6rem 0 0 0 var(--accent-soft), .6rem 0 0 0 var(--accent-soft); }

@keyframes plan-block-in {
  from { opacity: 0; transform: translateY(.6rem); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes code-line-in {
  from { opacity: 0; transform: translateX(-.65rem); }
  to { opacity: 1; transform: translateX(0); }
}
@keyframes diagram-node-in {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes diagram-path-in { to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  #doc .plan-block-motion, #doc pre.code-motion .code-line,
  #doc pre.diagram-motion svg * { animation: none !important; }
  #doc pre.diagram-motion svg .edgePath path, #doc pre.diagram-motion svg .flowchart-link,
  #doc pre.diagram-motion svg .messageLine0, #doc pre.diagram-motion svg .messageLine1,
  #doc pre.diagram-motion svg .loopLine { stroke-dasharray: none !important; stroke-dashoffset: 0 !important; }
}

aside { position: relative; font-family: ui-sans-serif, system-ui, sans-serif; }
.card { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent);
  border-radius: .5rem; padding: .7rem .8rem; margin-bottom: .7rem; font-size: .85rem; }
.card.done { border-left-color: var(--ok); opacity: .55; }
.card .quote { color: var(--muted); font-style: italic; font-size: .78rem;
  border-left: 2px solid var(--line); padding-left: .5rem; margin-bottom: .4rem;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card .body { white-space: pre-wrap; }
.card .foot { display: flex; gap: .5rem; align-items: center; margin-top: .5rem;
  font-size: .72rem; color: var(--muted); }
.card .foot button { padding: .1rem .4rem; font-size: .72rem; }
.empty { color: var(--muted); font-size: .85rem; padding: .5rem 0; }

#tip { position: absolute; z-index: 30; display: none; }
#tip button { box-shadow: 0 4px 14px rgba(0,0,0,.18); }
#composer { position: absolute; z-index: 31; display: none; width: 20rem;
  background: var(--panel); border: 1px solid var(--line); border-radius: .6rem;
  padding: .7rem; box-shadow: 0 8px 30px rgba(0,0,0,.2);
  font-family: ui-sans-serif, system-ui, sans-serif; }
#composer textarea { width: 100%; min-height: 5rem; resize: vertical; font: inherit;
  font-size: .85rem; background: var(--bg); color: var(--ink);
  border: 1px solid var(--line); border-radius: .4rem; padding: .5rem; }
#composer .row { display: flex; gap: .5rem; justify-content: flex-end; margin-top: .5rem; }
#toast { position: fixed; bottom: 1.2rem; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: .5rem 1rem; border-radius: .5rem;
  font-family: ui-sans-serif, system-ui, sans-serif; font-size: .85rem; display: none; z-index: 40; }
</style>
</head>
<body>

<header>
  <span class="title" id="title">Loading…</span>
  <span class="status" id="status"></span>
  <span class="status" id="diagram-status" aria-live="polite">Checking diagrams</span>
  <div id="narration" aria-label="Plan narration">
    <button class="ghost" id="previous" aria-label="Previous chunk">←</button>
    <button id="play">Listen</button>
    <button class="ghost" id="next" aria-label="Next chunk">→</button>
    <span id="progress" aria-live="polite"></span>
    <label id="voice-label" for="voice">Voice
      <select id="voice">
        <option value="">Best available</option>
      </select>
    </label>
    <label id="speed-label" for="rate">Speed
      <select id="rate">
        <option value="0.75">0.75×</option>
        <option value="1">1×</option>
        <option value="1.25">1.25×</option>
        <option value="1.5">1.5×</option>
        <option value="2">2×</option>
      </select>
    </label>
    <button class="ghost" id="viewmode">Show all</button>
    <button class="ghost" id="animate">Replay motion</button>
  </div>
  <select id="revsel" title="Revision"></select>
  <button class="ghost" id="refresh">Refresh</button>
  <button id="replan" disabled>Replan</button>
  <button class="primary" id="accept">Approve and implement</button>
</header>

<main>
  <article id="doc"></article>
  <aside id="gutter"></aside>
</main>

<div id="tip"><button class="primary">Comment</button></div>
<div id="composer">
  <textarea id="ctext" placeholder="What should change?"></textarea>
  <div class="row">
    <button class="ghost" id="ccancel">Cancel</button>
    <button class="primary" id="csave">Add comment</button>
  </div>
</div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/14.1.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/11.4.0/mermaid.min.js"></script>
<script>
"use strict";

const parts = location.pathname.split("/").filter(Boolean);
const PLAN = parts[1] || "";
const TOKEN = new URLSearchParams(location.search).get("token") || "";
const API = "/api/plan/" + PLAN;

let state = { meta: {}, revision: null, revisions: [], comments: [] };
let viewing = null;   // the revision number on screen
let pending = null;   // the selection a new comment attaches to
let diagramCheck = { generation: 0, revision: 0, status: "checking", count: 0, error: "" };

const $ = (id) => document.getElementById(id);
const RATE_KEY = "flow-plan-narration-rate";
const VOICE_KEY = "flow-plan-narration-voice";
const canSpeak = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;

function savedRate() {
  try {
    const value = Number(localStorage.getItem(RATE_KEY));
    return [0.75, 1, 1.25, 1.5, 2].includes(value) ? value : 1;
  } catch {
    return 1;
  }
}

function savedVoice() {
  try {
    return localStorage.getItem(VOICE_KEY) || "";
  } catch {
    return "";
  }
}

const narration = {
  chunks: [],
  index: 0,
  guided: true,
  playing: false,
  paused: false,
  generation: 0,
  rate: savedRate(),
  voiceURI: savedVoice(),
};
const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
const motion = { key: "" };

const preferredVoices = [
  "Daniel",
  "Reed",
  "Sandy",
  "Shelley",
  "Eddy",
  "Flo",
  "Samantha",
];

function narrationVoices() {
  if (!canSpeak) return [];
  const all = window.speechSynthesis.getVoices();
  const english = all.filter((voice) => /^en(?:-|_)/i.test(voice.lang));
  return english.length ? english : all;
}

function voiceScore(voice) {
  const name = voice.name || "";
  const preferred = preferredVoices.findIndex((candidate) => name === candidate || name.startsWith(candidate + " ("));
  let score = /natural|neural|premium|enhanced/i.test(name) ? 1000 : 0;
  if (preferred >= 0) score += 10000 - preferred * 100;
  if (/^en(?:-|_)US$/i.test(voice.lang)) score += 100;
  if (voice.localService) score += 20;
  if (voice.default) score -= 10;
  return score;
}

function bestVoice(voices) {
  return voices.slice().sort((a, b) => voiceScore(b) - voiceScore(a) || a.name.localeCompare(b.name))[0] || null;
}

function selectedVoice() {
  const voices = narrationVoices();
  return voices.find((voice) => voice.voiceURI === narration.voiceURI) || bestVoice(voices);
}

function populateVoices() {
  const select = $("voice");
  const voices = narrationVoices()
    .slice()
    .sort((a, b) => voiceScore(b) - voiceScore(a) || a.name.localeCompare(b.name));
  const automatic = bestVoice(voices);
  select.innerHTML = "";

  const option = document.createElement("option");
  option.value = "";
  option.textContent = automatic ? "Automatic — " + automatic.name : "Automatic";
  select.appendChild(option);

  voices.forEach((voice) => {
    const item = document.createElement("option");
    item.value = voice.voiceURI;
    item.textContent = voice.name + " (" + voice.lang.replace("_", "-") + ")";
    select.appendChild(item);
  });
  select.value = voices.some((voice) => voice.voiceURI === narration.voiceURI) ? narration.voiceURI : "";
  select.disabled = !canSpeak || voices.length === 0;
}

function toast(text) {
  const el = $("toast");
  el.textContent = text;
  el.style.display = "block";
  clearTimeout(el._t);
  el._t = setTimeout(() => (el.style.display = "none"), 2600);
}

function api(path, opts) {
  const join = path.includes("?") ? "&" : "?";
  return fetch(API + path + join + "token=" + TOKEN, opts).then(async (r) => {
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || r.statusText);
    return data;
  });
}

// --- rendering --------------------------------------------------------------

function slug(text) {
  return text.toLowerCase().replace(/[^\w]+/g, "-").replace(/^-|-$/g, "").slice(0, 60);
}

function headingLevel(el) {
  const match = /^H([1-3])$/.exec(el.tagName);
  return match ? Number(match[1]) : 0;
}

// Headings already divide a plan into useful pieces. A heading with no body
// joins the more specific heading after it, so "Changes" and its first file do
// not become two nearly empty chunks.
function planChunks(root) {
  const chunks = [];
  let current = null;

  for (const el of root.children) {
    const level = headingLevel(el);
    if (level) {
      const hasBody = current && current.elements.some((item) => !headingLevel(item));
      if (!current || hasBody || level <= current.lastHeading) {
        current = { elements: [], headings: [], lastHeading: level };
        chunks.push(current);
      } else {
        current.lastHeading = level;
      }
      current.headings.push(el.textContent.trim());
    } else if (!current) {
      current = { elements: [], headings: [], lastHeading: 0 };
      chunks.push(current);
    }
    current.elements.push(el);
  }

  chunks.forEach((chunk, index) => {
    chunk.index = index;
    chunk.title = chunk.headings.join(" — ") || "Plan";
    chunk.elements.forEach((el) => (el.dataset.chunk = String(index)));
  });
  return chunks;
}

function cleanSpeech(text) {
  return String(text || "").replace(/\s+/g, " ").trim();
}

function blockSpeech(el) {
  if (el.tagName === "PRE") return "";
  const copy = el.cloneNode(true);
  copy.querySelectorAll("pre, script, style").forEach((node) => node.remove());

  if (copy.tagName === "UL" || copy.tagName === "OL") {
    return Array.from(copy.children).map((item) => cleanSpeech(item.textContent)).filter(Boolean).join(". ");
  }
  if (copy.tagName === "TABLE") {
    return Array.from(copy.querySelectorAll("tr"))
      .map((row) => Array.from(row.children).map((cell) => cleanSpeech(cell.textContent)).join(", "))
      .filter(Boolean)
      .join(". ");
  }
  return cleanSpeech(copy.textContent);
}

function chunkSpeech(chunk) {
  const text = chunk.elements.map(blockSpeech).filter(Boolean).join(". ");
  return text || chunk.title;
}

function prepareCodeMotion(root) {
  root.querySelectorAll("pre:not(.mermaid) > code").forEach((code) => {
    const isDiff = code.classList.contains("language-diff");
    const lines = code.textContent.replace(/\n$/, "").split("\n");
    code.textContent = "";
    lines.forEach((line, index) => {
      const span = document.createElement("span");
      span.className = "code-line";
      if (isDiff && /^\+(?!\+\+)/.test(line)) span.classList.add("code-add");
      if (isDiff && /^-(?!--)/.test(line)) span.classList.add("code-remove");
      if (isDiff && /^@@/.test(line)) span.classList.add("code-hunk");
      span.style.setProperty("--motion-index", String(Math.min(index, 36)));
      span.textContent = line || " ";
      code.appendChild(span);
    });
  });
}

function motionVisible(el) {
  if (!narration.guided) return true;
  const block = el.closest("#doc > [data-chunk]");
  return block && Number(block.dataset.chunk) === narration.index;
}

function restartMotion(el, className) {
  el.classList.remove(className);
  void el.offsetWidth;
  el.classList.add(className);
}

function animateDiagram(pre) {
  const svg = pre.querySelector("svg");
  if (!svg) return;
  const staged = svg.querySelectorAll(".node, .cluster, .edgeLabel, .messageText, .labelText");
  staged.forEach((el, index) => el.style.setProperty("--motion-index", String(Math.min(index, 30))));
  const paths = svg.querySelectorAll(".edgePath path, .flowchart-link, .messageLine0, .messageLine1, .loopLine");
  paths.forEach((path, index) => {
    const length = path.getTotalLength ? Math.max(1, Math.ceil(path.getTotalLength())) : 600;
    path.style.setProperty("--path-length", String(length));
    path.style.setProperty("--motion-index", String(Math.min(index + 1, 30)));
  });
  restartMotion(pre, "diagram-motion");
}

function animatePlan(force) {
  const key = [viewing, narration.guided, narration.index].join(":");
  if (reducedMotion.matches || (!force && motion.key === key)) return;
  motion.key = key;
  requestAnimationFrame(() => {
    const blocks = Array.from($("doc").children).filter((el) => motionVisible(el));
    blocks.forEach((block, index) => {
      block.style.setProperty("--motion-index", String(Math.min(index, 12)));
      restartMotion(block, "plan-block-motion");
      const codeBlocks = block.matches("pre:not(.mermaid)")
        ? [block]
        : Array.from(block.querySelectorAll("pre:not(.mermaid)"));
      codeBlocks.forEach((pre) => restartMotion(pre, "code-motion"));
      const diagrams = block.matches("pre.mermaid")
        ? [block]
        : Array.from(block.querySelectorAll("pre.mermaid"));
      diagrams.forEach(animateDiagram);
    });
  });
}

function stopNarration() {
  narration.generation += 1;
  narration.playing = false;
  narration.paused = false;
  if (canSpeak) window.speechSynthesis.cancel();
}

function syncPresentation() {
  const doc = $("doc");
  doc.classList.toggle("guided", narration.guided);
  narration.chunks.forEach((chunk) => {
    const active = narration.guided && chunk.index === narration.index;
    chunk.elements.forEach((el) => el.classList.toggle("chunk-active", active));
  });

  const count = narration.chunks.length;
  const current = narration.chunks[narration.index];
  const progress = $("progress");
  progress.textContent = narration.guided && count ? narration.index + 1 + " / " + count : "";
  progress.title = current ? current.title : "";
  progress.setAttribute("aria-label", current
    ? "Chunk " + (narration.index + 1) + " of " + count + ": " + current.title
    : "No plan chunks");

  $("previous").disabled = !narration.guided || narration.index <= 0;
  $("next").disabled = !narration.guided || narration.index >= count - 1;
  $("play").disabled = !canSpeak || !narration.guided || count === 0;
  $("play").textContent = narration.paused ? "Resume" : narration.playing ? "Pause" : "Listen";
  $("play").title = canSpeak ? "Read this plan aloud" : "This browser cannot read text aloud";
  $("voice").disabled = !canSpeak || narrationVoices().length === 0;
  $("rate").disabled = !canSpeak;
  $("viewmode").textContent = narration.guided ? "Show all" : "Present";
  $("animate").disabled = reducedMotion.matches || count === 0;
  $("animate").title = reducedMotion.matches
    ? "Motion is disabled by your system preference"
    : "Replay code and diagram motion";
  animatePlan(false);
  renderGutter();
}

function focusChunk() {
  const chunk = narration.chunks[narration.index];
  if (!chunk || !chunk.elements[0]) return;
  chunk.elements[0].scrollIntoView({ block: "start", behavior: "smooth" });
}

function speakCurrent() {
  const chunk = narration.chunks[narration.index];
  if (!canSpeak || !chunk || !narration.guided || !narration.playing) return;

  const generation = ++narration.generation;
  const utterance = new SpeechSynthesisUtterance(chunkSpeech(chunk));
  const voice = selectedVoice();
  if (voice) {
    utterance.voice = voice;
    utterance.lang = voice.lang;
  }
  utterance.rate = narration.rate;
  utterance.onend = () => {
    if (generation !== narration.generation || !narration.playing) return;
    if (narration.index < narration.chunks.length - 1) {
      narration.index += 1;
      syncPresentation();
      focusChunk();
      speakCurrent();
      return;
    }
    narration.playing = false;
    narration.paused = false;
    syncPresentation();
  };
  utterance.onerror = () => {
    if (generation !== narration.generation) return;
    narration.playing = false;
    narration.paused = false;
    syncPresentation();
    toast("Narration stopped.");
  };
  window.speechSynthesis.speak(utterance);
  syncPresentation();
}

function toggleNarration() {
  if (!canSpeak || !narration.guided) return;
  if (narration.paused) {
    narration.paused = false;
    narration.playing = true;
    window.speechSynthesis.resume();
    return syncPresentation();
  }
  if (narration.playing) {
    narration.paused = true;
    window.speechSynthesis.pause();
    return syncPresentation();
  }
  narration.playing = true;
  speakCurrent();
}

function moveChunk(offset) {
  const target = Math.max(0, Math.min(narration.index + offset, narration.chunks.length - 1));
  if (target === narration.index) return;
  const keepReading = narration.playing && !narration.paused;
  stopNarration();
  narration.index = target;
  syncPresentation();
  focusChunk();
  if (keepReading) {
    narration.playing = true;
    speakCurrent();
  }
}

function preparePresentation(root, view) {
  view = view || {};
  stopNarration();
  narration.chunks = planChunks(root);
  narration.index = Math.max(0, Math.min(Number(view.index) || 0, narration.chunks.length - 1));
  narration.guided = view.guided !== false;
  syncPresentation();
}

// Give every top-level block a stable name, so a comment can point at it.
// The name is the enclosing heading plus the block's place under it.
function anchorBlocks(root) {
  let section = "top";
  let index = 0;
  for (const el of root.children) {
    if (/^H[1-3]$/.test(el.tagName)) {
      section = slug(el.textContent) || "section";
      index = 0;
    }
    el.dataset.anchor = section + "#" + index;
    el.dataset.section = section;
    index += 1;
  }
}

function syncReplanGate() {
  const open = state.comments.filter(isOpen).length;
  const diagramFailed = diagramCheck.status === "failed" &&
    Number(diagramCheck.revision) === Number(viewing) &&
    Number(viewing) === Number(state.meta.current_revision);
  $("replan").disabled = (open === 0 && !diagramFailed) || state.meta.status !== "review";
  $("replan").textContent = diagramFailed && open === 0
    ? "Repair diagrams"
    : open ? "Replan (" + open + ")" : "Replan";
}

function syncDiagramGate() {
  const badge = $("diagram-status");
  badge.classList.remove("ok", "error");
  badge.title = diagramCheck.error || "";

  if (diagramCheck.status === "passed") {
    badge.classList.add("ok");
    badge.textContent = diagramCheck.count
      ? diagramCheck.count + (diagramCheck.count === 1 ? " diagram rendered" : " diagrams rendered")
      : "No diagrams";
  } else if (diagramCheck.status === "failed") {
    badge.classList.add("error");
    badge.textContent = "Diagram check failed";
  } else {
    badge.textContent = "Checking diagrams";
  }

  const currentRevision = Number(viewing) === Number(state.meta.current_revision);
  const checkedRevision = Number(diagramCheck.revision) === Number(viewing);
  const passed = checkedRevision && diagramCheck.status === "passed";
  const accept = $("accept");
  accept.disabled = state.meta.status !== "review" || !state.revision || !currentRevision || !passed;
  if (!currentRevision) {
    accept.title = "Open the current revision before approval";
  } else if (!passed) {
    accept.title = diagramCheck.status === "failed"
      ? "Fix every Mermaid diagram before approval"
      : "Wait for the Mermaid rendering check";
  } else {
    accept.title = "Approve this rendered plan and start implementation";
  }
  syncReplanGate();
}

async function verifyDiagramRendering(nodes, generation) {
  let active = null;
  try {
    if (typeof mermaid === "undefined") throw new Error("The Mermaid renderer did not load.");
    for (let index = 0; index < nodes.length; index += 1) {
      active = nodes[index];
      const source = active.textContent;
      const rendered = await mermaid.render("flow-diagram-" + generation + "-" + index, source);
      if (generation !== diagramCheck.generation) return;
      active.innerHTML = rendered.svg;
      if (rendered.bindFunctions) rendered.bindFunctions(active);
      if (!active.querySelector("svg")) throw new Error("Mermaid did not produce SVG.");
      active.dataset.rendered = "true";
      if (!reducedMotion.matches && motionVisible(active)) requestAnimationFrame(() => animateDiagram(active));
      active = null;
    }
    if (generation !== diagramCheck.generation) return;
    diagramCheck.status = "passed";
    syncDiagramGate();
  } catch (error) {
    if (generation !== diagramCheck.generation) return;
    if (active) active.classList.add("error");
    diagramCheck.status = "failed";
    diagramCheck.error = error && error.message ? error.message : String(error);
    syncDiagramGate();
    toast("A Mermaid diagram failed to render. Fix it before approval.");
  }
}

function renderDoc(markdown, view) {
  const doc = $("doc");
  doc.classList.toggle("guided", view.guided !== false);
  doc.innerHTML = marked.parse(markdown || "*This plan has no document yet.*");

  // marked turns a mermaid fence into <pre><code class="language-mermaid">.
  // mermaid wants <pre class="mermaid"> holding the raw text.
  doc.querySelectorAll("pre > code.language-mermaid").forEach((code) => {
    const pre = document.createElement("pre");
    pre.className = "mermaid";
    pre.textContent = code.textContent;
    code.parentElement.replaceWith(pre);
  });
  prepareCodeMotion(doc);

  const diagrams = Array.from(doc.querySelectorAll("pre.mermaid"));
  const generation = diagramCheck.generation + 1;
  diagramCheck = {
    generation,
    revision: Number(viewing) || 0,
    status: diagrams.length ? "checking" : "passed",
    count: diagrams.length,
    error: "",
  };
  syncDiagramGate();

  anchorBlocks(doc);
  motion.key = "";
  preparePresentation(doc, view);

  if (diagrams.length) verifyDiagramRendering(diagrams, generation).then(renderGutter);
}

function isOpen(c) {
  return c.addressed_in === null || c.addressed_in === undefined;
}

function renderGutter() {
  const gutter = $("gutter");
  gutter.innerHTML = "";

  let mine = state.comments.filter((c) => Number(c.revision) === Number(viewing) || isOpen(c));
  if (narration.guided) {
    mine = mine.filter((c) => {
      const target = $("doc").querySelector('[data-anchor="' + CSS.escape(c.anchor || "") + '"]');
      return target && Number(target.dataset.chunk) === narration.index;
    });
  }
  if (!mine.length) {
    gutter.innerHTML = '<p class="empty">Select text in ' +
      (narration.guided ? "this chunk" : "the document") + " to leave a comment.</p>";
  }

  // Highlight what is commented on, and line each card up with its block.
  $("doc").querySelectorAll(".commented").forEach((el) => el.classList.remove("commented"));
  const top = gutter.getBoundingClientRect().top + window.scrollY;
  let last = 0;

  for (const c of mine) {
    const target = $("doc").querySelector('[data-anchor="' + CSS.escape(c.anchor || "") + '"]');
    if (target) target.classList.add("commented");

    const card = document.createElement("div");
    card.className = "card" + (isOpen(c) ? "" : " done");
    card.innerHTML =
      (c.quote ? '<div class="quote"></div>' : "") +
      '<div class="body"></div>' +
      '<div class="foot"><span class="tag"></span></div>';
    if (c.quote) card.querySelector(".quote").textContent = c.quote;
    card.querySelector(".body").textContent = c.body;
    card.querySelector(".tag").textContent = isOpen(c)
      ? "open · " + (c.anchor || "").split("#")[0]
      : "answered in revision " + c.addressed_in;

    if (isOpen(c)) {
      const del = document.createElement("button");
      del.className = "ghost";
      del.textContent = "Delete";
      del.onclick = () =>
        api("/comment/" + c.id, { method: "DELETE" }).then(() => load(viewing)).catch((e) => toast(e.message));
      card.querySelector(".foot").appendChild(del);
    }

    gutter.appendChild(card);

    // Nudge the card down to its block, but never on top of the one above.
    if (target) {
      const want = target.getBoundingClientRect().top + window.scrollY - top;
      const y = Math.max(last, want);
      card.style.marginTop = Math.max(0, y - card.offsetTop) + "px";
      last = card.offsetTop + card.offsetHeight + 8;
    }
  }
}

function renderHeader() {
  $("title").textContent = state.meta.title || "Plan";
  $("status").textContent = state.meta.status || "";

  const sel = $("revsel");
  sel.innerHTML = "";
  for (const r of state.revisions) {
    const o = document.createElement("option");
    o.value = r.n;
    o.textContent = "Revision " + r.n;
    if (Number(r.n) === Number(viewing)) o.selected = true;
    sel.appendChild(o);
  }
  sel.style.display = state.revisions.length > 1 ? "" : "none";

  syncDiagramGate();
}

function load(rev) {
  const q = rev ? "?revision=" + rev : "";
  return api(q)
    .then((data) => {
      const nextRevision = data.revision ? data.revision.n : 0;
      const sameRevision = Number(viewing) === Number(nextRevision);
      const view = sameRevision
        ? { index: narration.index, guided: narration.guided }
        : { index: 0, guided: true };
      state = data;
      viewing = nextRevision;
      renderDoc(data.revision && data.revision.plan_md, view);
      renderHeader();
      renderGutter();
    })
    .catch((e) => toast(e.message));
}

// --- commenting -------------------------------------------------------------

function hidePopups() {
  $("tip").style.display = "none";
  $("composer").style.display = "none";
}

// Put a popup near the selection, and keep every edge on screen. A selection
// at the bottom of the window would otherwise put the button below the fold.
function place(el, box) {
  el.style.visibility = "hidden";
  el.style.display = "block";
  const w = el.offsetWidth;
  const h = el.offsetHeight;
  const gap = 8;

  let top = box.bottom + gap;
  if (top + h > window.innerHeight - gap) {
    // No room under the selection. Go above it, or pin it to the top.
    top = box.top - h - gap;
    if (top < gap) top = Math.max(gap, window.innerHeight - h - gap);
  }
  const left = Math.max(gap, Math.min(box.left, window.innerWidth - w - gap));

  el.style.top = top + window.scrollY + "px";
  el.style.left = left + window.scrollX + "px";
  el.style.visibility = "";
}

// Remember where the selection was, so the composer opens where the tip did.
let anchorBox = null;

// Offer the button whenever the selection settles, however it was made. A
// mouseup listener alone misses a selection made with shift and the arrows.
let settle = null;

function onSelection() {
  // The composer holds the selection while you type in it.
  if ($("composer").style.display === "block") return;

  const sel = window.getSelection();
  const text = sel && sel.toString().trim();
  if (!text || !sel.rangeCount) return hidePopups();

  // Anchor to the block the selection STARTS in. The common ancestor is #doc
  // itself as soon as the selection spans a block boundary, and #doc carries
  // no anchor of its own.
  const range = sel.getRangeAt(0);
  let node = range.startContainer;
  if (node.nodeType === 3) node = node.parentElement;
  const block = node && node.closest && node.closest("#doc > [data-anchor]");
  if (!block) return hidePopups();

  pending = { anchor: block.dataset.anchor, quote: text.slice(0, 2000) };
  anchorBox = range.getBoundingClientRect();
  place($("tip"), anchorBox);
}

document.addEventListener("selectionchange", () => {
  clearTimeout(settle);
  settle = setTimeout(onSelection, 180);
});

$("tip").querySelector("button").onclick = () => {
  $("tip").style.display = "none";
  $("ctext").value = "";
  place($("composer"), anchorBox || { top: 100, bottom: 100, left: 100 });
  $("ctext").focus();
};

$("ccancel").onclick = hidePopups;

$("csave").onclick = () => {
  const body = $("ctext").value.trim();
  if (!body || !pending) return;
  api("/comment", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ ...pending, body, revision: viewing }),
  })
    .then(() => {
      hidePopups();
      window.getSelection().removeAllRanges();
      return load(viewing);
    })
    .catch((e) => toast(e.message));
};

document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape") hidePopups();
  if (ev.key === "Enter" && (ev.metaKey || ev.ctrlKey) && $("composer").style.display === "block") {
    $("csave").click();
  }
});

// --- actions ----------------------------------------------------------------

populateVoices();
if (canSpeak) window.speechSynthesis.addEventListener("voiceschanged", populateVoices);
$("rate").value = String(narration.rate);
$("play").onclick = toggleNarration;
$("previous").onclick = () => moveChunk(-1);
$("next").onclick = () => moveChunk(1);
$("animate").onclick = () => animatePlan(true);
$("viewmode").onclick = () => {
  stopNarration();
  narration.guided = !narration.guided;
  syncPresentation();
  if (narration.guided) focusChunk();
};
$("voice").onchange = (ev) => {
  const keepReading = narration.playing && !narration.paused;
  stopNarration();
  narration.voiceURI = ev.target.value;
  try {
    if (narration.voiceURI) localStorage.setItem(VOICE_KEY, narration.voiceURI);
    else localStorage.removeItem(VOICE_KEY);
  } catch {}
  syncPresentation();
  if (keepReading) {
    narration.playing = true;
    speakCurrent();
  }
};
$("rate").onchange = (ev) => {
  const keepReading = narration.playing && !narration.paused;
  stopNarration();
  narration.rate = Number(ev.target.value) || 1;
  try {
    localStorage.setItem(RATE_KEY, String(narration.rate));
  } catch {}
  syncPresentation();
  if (keepReading) {
    narration.playing = true;
    speakCurrent();
  }
};

$("refresh").onclick = () => load(viewing);
$("revsel").onchange = (ev) => load(ev.target.value);

$("replan").onclick = () => {
  $("replan").disabled = true;
  const open = state.comments.filter(isOpen).length;
  const diagramFailed = diagramCheck.status === "failed" &&
    Number(diagramCheck.revision) === Number(viewing);
  const prepare = diagramFailed && open === 0
    ? api("/comment", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          anchor: "diagrams#0",
          quote: "Mermaid rendering check failed",
          body: "Fix every Mermaid diagram so Mermaid 11 renders each one as SVG. Renderer error: " +
            (diagramCheck.error || "unknown rendering error"),
          revision: viewing,
        }),
      })
    : Promise.resolve();
  prepare.then(() => api("/replan", { method: "POST" }))
    .then(() => toast("Claude is revising the plan. This page refreshes when it lands."))
    .catch((e) => {
      $("replan").disabled = false;
      toast(e.message);
    });
};

$("accept").onclick = () => {
  if (diagramCheck.status !== "passed" || Number(diagramCheck.revision) !== Number(viewing)) return;
  $("accept").disabled = true;
  api("/accept", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      revision: viewing,
      diagram_check: "passed",
      diagram_count: diagramCheck.count,
    }),
  })
    .then(() => toast("Plan accepted. Claude is implementing it in an isolated worktree."))
    .catch((e) => {
      $("accept").disabled = false;
      toast(e.message);
    });
};

// --- start ------------------------------------------------------------------

if (typeof mermaid !== "undefined") {
  mermaid.initialize({
    startOnLoad: false,
    securityLevel: "strict",
    theme: window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "neutral",
    fontFamily: "ui-sans-serif, system-ui, sans-serif",
  });
}

load();

// A replan or an accept changes the state from outside this page. Poll gently
// so the page keeps up without a socket.
setInterval(() => {
  api("").then((data) => {
    const changed =
      data.meta.current_revision !== state.meta.current_revision ||
      data.meta.status !== state.meta.status ||
      data.comments.length !== state.comments.length;
    if (changed) load();
  }).catch(() => {});
}, 4000);

window.addEventListener("resize", () => renderGutter());
window.addEventListener("beforeunload", stopNarration);
</script>
</body>
</html>
